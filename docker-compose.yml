services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: task-management-app

    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - .:/var/www/html

    networks:
      - task-management

    depends_on:
      mysql:
        condition: service_healthy


  nginx:
    image: nginx:alpine

    container_name: task-management-nginx

    restart: unless-stopped

    ports:
      - "8081:80"

    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - task-management

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-management-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - task-management
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
    command: php artisan schedule:work

  mysql:
    image: mysql:8.4

    container_name: task-management-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: task_management
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel_password
      MYSQL_ROOT_PASSWORD: root_password

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - task-management

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot_password"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


networks:
  task-management:
    driver: bridge


volumes:
  mysql_data:
