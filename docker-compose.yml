services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: task-management-app

    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - .:/var/www/html

    networks:
      - task-management

    depends_on:
      mysql:
        condition: service_healthy


  nginx:
    image: nginx:alpine

    container_name: task-management-nginx

    restart: unless-stopped

    # RISIKO: tanpa "127.0.0.1:" di depan, Docker bind port ini ke SEMUA
    # interface (0.0.0.0) dan bisa diakses langsung dari LAN/WAN -- bahkan
    # menembus aturan `ufw deny` karena Docker menulis rule iptables sendiri
    # di luar chain yang dikontrol ufw. Cloudflare Tunnel menjangkau nginx
    # lewat nama container di docker network internal, BUKAN lewat port ini
    # -- jadi port host cukup untuk akses debug lokal di server saja.
    ports:
      - "127.0.0.1:8081:80"

    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - task-management

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-management-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - task-management
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
    command: php artisan schedule:work

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-management-reverb
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - task-management
    depends_on:
      mysql:
        condition: service_healthy
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-management-queue-worker
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - task-management
    depends_on:
      mysql:
        condition: service_healthy
    command: php artisan queue:work --tries=3

  mysql:
    image: mysql:8.4

    container_name: task-management-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: task_management
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel_password
      MYSQL_ROOT_PASSWORD: root_password

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - task-management

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot_password"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: task-management-cloudflared
    restart: unless-stopped
    # SUMBER : CLOUDFLARE_TUNNEL_TOKEN di .env (dashboard Zero Trust > Networks > Tunnels).
    # RISIKO : F-hardcode-secret -- jangan pernah taruh token literal di sini lagi,
    #          file ini di-track git dan token akan tinggal permanen di history.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - task-management
    depends_on:
      - nginx

networks:
  task-management:
    driver: bridge

volumes:
  mysql_data:
