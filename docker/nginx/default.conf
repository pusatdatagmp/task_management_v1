server {
    listen 80;
    server_name _;

    root /var/www/html/public;

    index index.php index.html;

    client_max_body_size 50M;

    # F-184: proxy WebSocket Reverb -- path /app/{key} (handshake client) dan
    # /apps/{id}/... (REST API publish event dari container `app`) HARUS ke
    # service reverb:8080, bukan PHP-FPM. Header Upgrade/Connection wajib ada,
    # tanpa ini nginx menolak upgrade koneksi jadi WebSocket (fallback ke HTTP
    # biasa, client Echo gagal connect diam-diam).
    location ~ ^/(app|apps)/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;

        fastcgi_pass app:9000;

        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
